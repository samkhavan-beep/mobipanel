<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111823; --panel-2:#161f2c; --line:#233047;
    --text:#e7edf5; --muted:#8ea0b8; --accent:#22c58b; --accent-dim:#1a9c6f;
    --danger:#e2564f; --warn:#e6b854; --radius:10px;
  }
  [data-theme="light"]{
    --bg:#f4f6f9; --panel:#ffffff; --panel-2:#eef2f7; --line:#dde4ec;
    --text:#131a24; --muted:#5c6b80; --accent:#0f9d68; --accent-dim:#0c7d53;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  a{color:inherit}
  .hidden{display:none !important}
  /* ---------- Login ---------- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:36px 32px;width:100%;max-width:380px}
  .login-card h1{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .login-card .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
  .login-card p{color:var(--muted);font-size:13px;margin:0 0 24px}
  label{font-size:13px;color:var(--muted);display:block;margin:14px 0 6px}
  input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button{cursor:pointer;font-family:inherit}
  .btn{background:var(--accent);color:#04140d;border:none;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600}
  .btn:hover{background:var(--accent-dim)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-block{width:100%;margin-top:20px;padding:11px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px}
  /* ---------- App shell ---------- */
  #app{display:flex;min-height:100vh}
  nav{width:220px;background:var(--panel);border-left:1px solid var(--line);padding:20px 14px;flex-shrink:0}
  nav h2{font-size:16px;display:flex;align-items:center;gap:8px;margin:0 0 24px}
  nav .navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:14px;margin-bottom:4px}
  nav .navitem.active,nav .navitem:hover{background:var(--panel-2);color:var(--text)}
  main{flex:1;padding:26px 32px;max-width:1200px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .topbar h1{font-size:20px;margin:0}
  .topbar .right{display:flex;gap:10px;align-items:center}
  .icon-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
  /* ---------- Cards / grid ---------- */
  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .stat .label{color:var(--muted);font-size:12px;margin-bottom:8px}
  .stat .value{font-size:26px;font-weight:700}
  .stat .value.accent{color:var(--accent)}
  .section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .section-head h3{margin:0;font-size:15px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:right;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px}
  td{padding:10px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px}
  .badge.on{background:rgba(34,197,139,.15);color:var(--accent)}
  .badge.off{background:rgba(226,86,79,.15);color:var(--danger)}
  .row-actions{display:flex;gap:6px}
  .row-actions button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:5px 10px;border-radius:6px;font-size:12px}
  .row-actions button:hover{border-color:var(--accent)}
  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
  .modal h3{margin:0 0 18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
  select{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit}
  .checks{display:flex;flex-direction:column;gap:6px;max-height:120px;overflow:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px}
  .checks label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin:0}
  .link-box{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;word-break:break-all;margin-bottom:10px;font-family:monospace}
</style>
</head>
<body data-theme="dark">

<!-- ---------------- LOGIN ---------------- -->
<div id="loginScreen">
  <div class="login-card">
    <h1><span class="dot"></span> ورود به پنل</h1>
    <p>برای مدیریت سرور وارد شوید</p>
    <label>نام کاربری</label>
    <input id="loginUser" autocomplete="username">
    <label>رمز عبور</label>
    <input id="loginPass" type="password" autocomplete="current-password">
    <div id="otpWrap" class="hidden">
      <label>کد ۲مرحله‌ای (Google Authenticator)</label>
      <input id="loginOtp" maxlength="6">
    </div>
    <button class="btn btn-block" onclick="doLogin()">ورود</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ---------------- APP ---------------- -->
<div id="app" class="hidden">
  <nav>
    <h2><span class="dot"></span> پنل</h2>
    <div class="navitem active" data-tab="dashboard" onclick="showTab('dashboard')">📊 داشبورد</div>
    <div class="navitem" data-tab="clients" onclick="showTab('clients')">👤 کاربران</div>
    <div class="navitem" data-tab="inbounds" onclick="showTab('inbounds')">🔌 اینباندها</div>
    <div class="navitem" onclick="logout()" style="margin-top:20px;color:var(--danger)">⏻ خروج</div>
  </nav>

  <main>
    <div class="topbar">
      <h1 id="pageTitle">داشبورد</h1>
      <div class="right">
        <div class="icon-btn" onclick="toggleTheme()">🌓</div>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="tab-dashboard">
      <div class="grid-stats" id="statsGrid"></div>
    </div>

    <!-- CLIENTS -->
    <div id="tab-clients" class="hidden">
      <div class="section">
        <div class="section-head">
          <h3>لیست کاربران</h3>
          <button class="btn" onclick="openClientModal()">+ کاربر جدید</button>
        </div>
        <table>
          <thead><tr><th>نام</th><th>گروه</th><th>مصرف/سقف</th><th>انقضا</th><th>وضعیت</th><th>عملیات</th></tr></thead>
          <tbody id="clientsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- INBOUNDS -->
    <div id="tab-inbounds" class="hidden">
      <div class="section">
        <div class="section-head">
          <h3>لیست اینباندها</h3>
          <button class="btn" onclick="openInboundModal()">+ اینباند جدید</button>
        </div>
        <table>
          <thead><tr><th>نام</th><th>پروتکل</th><th>پورت</th><th>Transport</th><th>Security</th><th>وضعیت</th><th>عملیات</th></tr></thead>
          <tbody id="inboundsBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- ---------------- CLIENT MODAL ---------------- -->
<div id="clientModal" class="overlay hidden">
  <div class="modal">
    <h3>کاربر جدید</h3>
    <label>نام</label><input id="cName">
    <div class="grid2">
      <div><label>ایمیل (اختیاری)</label><input id="cEmail"></div>
      <div><label>گروه</label><input id="cGroup" value="default"></div>
    </div>
    <div class="grid2">
      <div><label>سقف حجم (گیگابایت، ۰=نامحدود)</label><input id="cTraffic" type="number" value="0"></div>
      <div><label>انقضا (روز، خالی=همیشگی)</label><input id="cExpire" type="number" placeholder="30"></div>
    </div>
    <label>محدودیت دستگاه هم‌زمان (۰=نامحدود)</label>
    <input id="cDevice" type="number" value="0">
    <label>اینباندها</label>
    <div class="checks" id="cInbounds"></div>
    <div class="modal-actions">
      <button class="btn-ghost" style="padding:9px 16px;border-radius:8px" onclick="closeModal('clientModal')">انصراف</button>
      <button class="btn" onclick="saveClient()">ذخیره</button>
    </div>
  </div>
</div>

<!-- ---------------- INBOUND MODAL ---------------- -->
<div id="inboundModal" class="overlay hidden">
  <div class="modal">
    <h3>اینباند جدید</h3>
    <label>نام مستعار (Remark)</label><input id="iRemark">
    <div class="grid2">
      <div><label>پروتکل</label>
        <select id="iProtocol">
          <option value="vless">VLESS</option>
          <option value="vmess">VMess</option>
          <option value="trojan">Trojan</option>
          <option value="shadowsocks">Shadowsocks</option>
        </select>
      </div>
      <div><label>پورت</label><input id="iPort" type="number"></div>
    </div>
    <div class="grid2">
      <div><label>Transport</label>
        <select id="iTransport">
          <option value="tcp">TCP</option>
          <option value="ws">WebSocket</option>
          <option value="grpc">gRPC</option>
          <option value="http2">HTTP/2</option>
        </select>
      </div>
      <div><label>Security</label>
        <select id="iSecurity">
          <option value="none">None</option>
          <option value="tls">TLS</option>
          <option value="reality">Reality</option>
        </select>
      </div>
    </div>
    <label>SNI / دامنه</label><input id="iSni" placeholder="example.com">
    <div class="modal-actions">
      <button class="btn-ghost" style="padding:9px 16px;border-radius:8px" onclick="closeModal('inboundModal')">انصراف</button>
      <button class="btn" onclick="saveInbound()">ذخیره</button>
    </div>
  </div>
</div>

<!-- ---------------- SUBSCRIPTION MODAL ---------------- -->
<div id="subModal" class="overlay hidden">
  <div class="modal">
    <h3>لینک اشتراک</h3>
    <div id="subContent"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('subModal')">بستن</button>
    </div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('panel_token') || null;
let allInbounds = [];

function api(path, opts={}) {
  opts.headers = opts.headers || {};
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers['Content-Type'] = 'application/json';
  }
  return fetch(path, opts).then(async r => {
    if (!r.ok) { const e = await r.json().catch(()=>({detail:'خطا'})); throw new Error(e.detail || 'خطا'); }
    return r.json();
  });
}

// ---------- Auth ----------
function doLogin() {
  const username = document.getElementById('loginUser').value;
  const password = document.getElementById('loginPass').value;
  const otp_code = document.getElementById('loginOtp').value;
  api('/api/auth/login', {method:'POST', body: JSON.stringify({username, password, otp_code})})
    .then(res => {
      TOKEN = res.access_token;
      localStorage.setItem('panel_token', TOKEN);
      enterApp();
    })
    .catch(err => document.getElementById('loginErr').innerText = err.message);
}

function logout() {
  TOKEN = null;
  localStorage.removeItem('panel_token');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function enterApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadDashboard();
  loadInbounds();
  loadClients();
}

// ---------- Tabs ----------
function showTab(name) {
  document.querySelectorAll('.navitem[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === name));
  ['dashboard','clients','inbounds'].forEach(t => document.getElementById('tab-'+t).classList.toggle('hidden', t !== name));
  document.getElementById('pageTitle').innerText = {dashboard:'داشبورد', clients:'کاربران', inbounds:'اینباندها'}[name];
}

function toggleTheme() {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === 'dark' ? 'light' : 'dark';
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// ---------- Dashboard ----------
function loadDashboard() {
  api('/api/dashboard/stats').then(s => {
    const grid = document.getElementById('statsGrid');
    grid.innerHTML = `
      <div class="stat"><div class="label">کل کاربران</div><div class="value">${s.total_clients}</div></div>
      <div class="stat"><div class="label">کاربران فعال</div><div class="value accent">${s.active_clients}</div></div>
      <div class="stat"><div class="label">کاربران منقضی</div><div class="value">${s.expired_clients}</div></div>
      <div class="stat"><div class="label">مصرف کل (GB)</div><div class="value">${s.total_traffic_used_gb}</div></div>
      <div class="stat"><div class="label">کل اینباندها</div><div class="value">${s.total_inbounds}</div></div>
      <div class="stat"><div class="label">اینباند فعال</div><div class="value accent">${s.active_inbounds}</div></div>
    `;
  });
}

// ---------- Clients ----------
function loadClients() {
  api('/api/clients').then(list => {
    const body = document.getElementById('clientsBody');
    body.innerHTML = list.map(c => `
      <tr>
        <td>${c.name}</td>
        <td>${c.group}</td>
        <td>${(c.traffic_used_bytes/1073741824).toFixed(2)} / ${c.traffic_limit_bytes ? (c.traffic_limit_bytes/1073741824).toFixed(0)+' GB' : '∞'}</td>
        <td>${c.expire_at ? new Date(c.expire_at).toLocaleDateString('fa-IR') : 'همیشگی'}</td>
        <td><span class="badge ${c.is_active ? 'on':'off'}">${c.is_active ? 'فعال':'غیرفعال'}</span></td>
        <td class="row-actions">
          <button onclick="viewSub(${c.id})">لینک</button>
          <button onclick="toggleClient(${c.id}, ${c.is_active})">${c.is_active?'غیرفعال':'فعال'}</button>
          <button onclick="resetTraffic(${c.id})">ریست</button>
          <button style="color:var(--danger)" onclick="deleteClient(${c.id})">حذف</button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="6" style="color:var(--muted)">هنوز کاربری اضافه نشده</td></tr>';
  });
}

function openClientModal() {
  document.getElementById('cInbounds').innerHTML = allInbounds.map(i =>
    `<label><input type="checkbox" value="${i.id}"> ${i.remark} (${i.protocol}:${i.listen_port})</label>`
  ).join('') || '<span style="color:var(--muted);font-size:12px">ابتدا یک اینباند بسازید</span>';
  document.getElementById('clientModal').classList.remove('hidden');
}

function saveClient() {
  const inbound_ids = [...document.querySelectorAll('#cInbounds input:checked')].map(el => parseInt(el.value));
  const payload = {
    name: document.getElementById('cName').value,
    email: document.getElementById('cEmail').value || null,
    group: document.getElementById('cGroup').value || 'default',
    traffic_limit_gb: parseFloat(document.getElementById('cTraffic').value) || 0,
    expire_days: document.getElementById('cExpire').value ? parseInt(document.getElementById('cExpire').value) : null,
    device_limit: parseInt(document.getElementById('cDevice').value) || 0,
    inbound_ids
  };
  api('/api/clients', {method:'POST', body: JSON.stringify(payload)})
    .then(() => { closeModal('clientModal'); loadClients(); loadDashboard(); })
    .catch(e => alert(e.message));
}

function toggleClient(id, current) {
  api(`/api/clients/${id}`, {method:'PATCH', body: JSON.stringify({is_active: !current})}).then(() => { loadClients(); loadDashboard(); });
}
function resetTraffic(id) {
  api(`/api/clients/${id}/reset-traffic`, {method:'POST'}).then(loadClients);
}
function deleteClient(id) {
  if (!confirm('حذف این کاربر مطمئنید؟')) return;
  api(`/api/clients/${id}`, {method:'DELETE'}).then(() => { loadClients(); loadDashboard(); });
}
function viewSub(id) {
  api(`/api/clients/${id}/subscription`).then(res => {
    const content = document.getElementById('subContent');
    if (!res.links.length) {
      content.innerHTML = '<p style="color:var(--muted)">این کاربر به هیچ اینباندی وصل نیست.</p>';
    } else {
      content.innerHTML = res.links.map((l, i) => `
        <div class="link-box">${l}</div>
        <img src="${res.qr_codes[i]}" style="width:140px;border-radius:8px;margin-bottom:16px">
      `).join('');
    }
    document.getElementById('subModal').classList.remove('hidden');
  });
}

// ---------- Inbounds ----------
function loadInbounds() {
  api('/api/inbounds').then(list => {
    allInbounds = list;
    const body = document.getElementById('inboundsBody');
    body.innerHTML = list.map(i => `
      <tr>
        <td>${i.remark}</td>
        <td>${i.protocol.toUpperCase()}</td>
        <td>${i.listen_port}</td>
        <td>${i.transport}</td>
        <td>${i.security}</td>
        <td><span class="badge ${i.is_active?'on':'off'}">${i.is_active?'فعال':'غیرفعال'}</span></td>
        <td class="row-actions">
          <button onclick="toggleInbound(${i.id})">${i.is_active?'غیرفعال':'فعال'}</button>
          <button style="color:var(--danger)" onclick="deleteInbound(${i.id})">حذف</button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="7" style="color:var(--muted)">هنوز اینباندی اضافه نشده</td></tr>';
  });
}

function openInboundModal() { document.getElementById('inboundModal').classList.remove('hidden'); }

function saveInbound() {
  const payload = {
    remark: document.getElementById('iRemark').value,
    protocol: document.getElementById('iProtocol').value,
    listen_port: parseInt(document.getElementById('iPort').value),
    transport: document.getElementById('iTransport').value,
    security: document.getElementById('iSecurity').value,
    sni: document.getElementById('iSni').value || null,
  };
  api('/api/inbounds', {method:'POST', body: JSON.stringify(payload)})
    .then(() => { closeModal('inboundModal'); loadInbounds(); loadDashboard(); })
    .catch(e => alert(e.message));
}
function toggleInbound(id) {
  api(`/api/inbounds/${id}/toggle`, {method:'PATCH'}).then(loadInbounds);
}
function deleteInbound(id) {
  if (!confirm('حذف این اینباند مطمئنید؟')) return;
  api(`/api/inbounds/${id}`, {method:'DELETE'}).then(() => { loadInbounds(); loadDashboard(); });
}

// ---------- Boot ----------
if (TOKEN) {
  api('/api/auth/me').then(enterApp).catch(logout);
}
</script>
</body>
</html>
